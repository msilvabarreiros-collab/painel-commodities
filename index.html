function saoPauloDate(){var parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Sao_Paulo',year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date());var p={};parts.forEach(function(x){p[x.type]=+x.value});return p;}
function contractsFor(t){
 var now=saoPauloDate(),a=[];
 // Usar ano com quatro dígitos: BMFBOVESPA:BGIV2026, não BGIV26.
 // A rolagem por data é aproximada e conservadora, não substitui o calendário oficial da B3.
 for(var year=now.year;year<now.year+4&&a.length<t.count;year++){
  t.months.forEach(function(m){
   if(a.length>=t.count)return;
   var expiryYear=year, expiryMonth=m, expiryDay=29;
   if(t.id==='soja'){expiryMonth=m-1;expiryDay=28;if(expiryMonth===0){expiryMonth=12;expiryYear--}}
   else if(t.id==='milho')expiryDay=14;
   else if(t.id==='cafe')expiryDay=17;
   if(expiryYear<now.year || expiryYear===now.year && (expiryMonth<now.month || expiryMonth===now.month&&expiryDay<now.day))return;
   var code=t.prefix+LETTERS[m]+year;
   a.push({code:code,month:MONTHS[m-1]+'/'+year,sym:'BMFBOVESPA:'+code});
  });
 }
 return a;
}
