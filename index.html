<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mercado Futuro | Commodities</title>
<style>
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;background:#0b0d10;color:#f3f5f7;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
header{height:11vh;display:flex;align-items:center;justify-content:space-between;padding:0 3vw;border-bottom:1px solid #2a2e34}
.brand{font-size:2.1vw;font-weight:700;letter-spacing:.04em}.sub{font-size:.95vw;color:#9da5ae;margin-top:.4vh}
.headerLogo{height:6.5vh;border-radius:6px;display:block}
.clock{text-align:right;font-size:1.4vw;font-weight:700}.date{font-size:.85vw;color:#9da5ae;margin-top:.3vh}

.tickerBar{border-bottom:1px solid #2a2e34;background:#0d0f13;padding:.6vh 0}

main{flex:1;padding:1.6vh 3vw;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:1.3vw;min-height:0}
.card{border:1px solid #30353c;border-radius:16px;padding:1.2vw 1.3vw;display:flex;flex-direction:column;background:#111419;min-width:0;min-height:0;overflow:hidden}
.name{font-size:1.35vw;font-weight:700}.code{font-size:.78vw;color:#8f98a3;margin-top:.2vh}
.unit{font-size:.78vw;color:#8f98a3;margin-top:.1vh}

.quoteWrap{flex:0 0 38%;margin-top:.8vh;border-bottom:1px solid #23272d;padding-bottom:.6vh;display:flex;align-items:center}
.chartWrap{flex:1;margin-top:.8vh;min-height:0;border-radius:8px;overflow:hidden}
.tradingview-widget-container{height:100%;width:100%}

footer{height:6.5vh;padding:0 3vw;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #2a2e34;color:#8f98a3;font-size:.78vw}
.status{display:flex;gap:.6vw;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:#69d38a}
.sponsorLogo{height:3.4vh;border-radius:4px;display:block}
</style>
