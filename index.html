/* V11: quinta tela com dois gráficos lado a lado */
.dualPage .main{display:block;padding:0 2.4%}
.dualPage .contracts{display:none}
.dualPage .chartPanel{height:100%}
.dualPage .chartHost{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:10px;min-height:0}
.dualChart{display:flex;flex-direction:column;min-height:0;min-width:0;border:1px solid #145977;border-radius:12px;overflow:hidden;background:rgba(1,14,27,.96)}
.dualTitle{font-size:clamp(13px,1.25vw,19px);font-weight:700;padding:10px 12px;border-bottom:1px solid #174058}
.dualWidget{flex:1;min-height:0}
.dualWidget .tradingview-widget-container,.dualWidget .tradingview-widget-container__widget{height:100%;width:100%}
.dualPage:before{background-image:linear-gradient(120deg,#03121e,#123249)}
@media(max-width:850px){.dualPage .chartHost{gap:5px;padding:5px}.dualTitle{padding:7px;font-size:12px}.nav small{font-size:9px}}

/* V12: temas fotográficos independentes, sem conteúdo da interface embutido na foto */
.app:before{inset:52px 0 0;background-image:linear-gradient(90deg,rgba(1,12,21,.92) 0%,rgba(1,15,27,.76) 45%,rgba(1,15,27,.49) 100%),var(--bg);background-repeat:no-repeat;background-position:center top;background-size:cover;filter:none}
.app:after{inset:52px 0 0;background:linear-gradient(180deg,rgba(0,12,22,.10) 0%,rgba(0,12,22,.62) 42%,rgba(0,12,22,.90) 100%)}
.header{position:relative;z-index:1}
.datetime{margin-left:auto;display:flex;align-items:center;justify-content:flex-end;gap:10px;width:max-content;max-width:100%;padding:9px 13px;border:1px solid #23799a;border-radius:12px;background:rgba(0,14,28,.85);font-size:clamp(11px,1.05vw,16px);font-variant-numeric:tabular-nums;color:#e8f7ff;box-shadow:0 4px 20px #0007}
.datetime strong{font-size:clamp(16px,1.65vw,27px);color:#5cddff;letter-spacing:1px}
.dateIcon{font-size:20px;color:#5cddff}
/* Quote widgets need an independent viewport: keep full content below the contract label. */
.contract{position:relative;padding:7px 12px 5px;overflow:hidden}
.ctop{position:relative;z-index:2;min-height:36px}
.widgetbox{position:relative;flex:1;min-height:0;display:block;overflow:hidden;margin-top:1px}
.widgetbox .tradingview-widget-container{position:absolute;left:0;top:0;width:125%!important;height:125%!important;min-height:0!important;display:block;transform:scale(.80);transform-origin:top left;overflow:visible}
.widgetbox .tradingview-widget-container__widget{height:100%!important;width:100%!important}
.widgetbox iframe{display:block;max-width:none!important;max-height:none!important}
/* Dual charts should never be stretched while TradingView initializes. */
.dualPage .chartHost{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);min-height:0;overflow:hidden}
.dualChart{height:100%;min-height:0;overflow:hidden}
.dualWidget{position:relative;min-height:0;flex:1;overflow:hidden}
.dualWidget .tradingview-widget-container{position:absolute;inset:0;width:100%;height:100%}
.dualWidget iframe{width:100%!important;height:100%!important}
.footer{visibility:hidden;flex-basis:8px}

/* V14 — apenas BOI: reposicionar o widget dentro da área útil do cartão.
   A altura interna maior evita que o TradingView recorte o valor;
   o redimensionamento reduz o widget inteiro sem deslocar as outras páginas. */
.boiPage .contract .widgetbox {
  position:relative!important;
  flex:1 1 auto!important;
  min-height:0!important;
  margin-top:0!important;
  overflow:hidden!important;
}
.boiPage .contract .widgetbox > .tradingview-widget-container {
  position:absolute!important;
  top:-13px!important;
  left:0!important;
  width:185.185%!important;
  height:180px!important;
  min-height:180px!important;
  transform:scale(.54)!important;
  transform-origin:top left!important;
  display:block!important;
}
.boiPage .contract .widgetbox .tradingview-widget-container__widget {
  width:100%!important;height:100%!important;
}
.boiPage .contract .widgetbox iframe {
  width:100%!important;height:180px!important;max-width:none!important;
}
@media(max-height:750px){
  .boiPage .contract .widgetbox > .tradingview-widget-container {
    top:-14px!important;height:165px!important;min-height:165px!important;
  }
  .boiPage .contract .widgetbox iframe {height:165px!important}
}

/* V16: todos os mercados de commodities. O widget ja mostra o codigo do contrato;
   retirar cabecalho duplicado e disponibilizar todo o quadro ao TradingView. */
.app:not(.dualPage) .contract{padding:4px 9px!important;}
.app:not(.dualPage) .contract .ctop{display:none!important;}
.app:not(.dualPage) .contract .widgetbox{position:relative!important;display:block!important;flex:1 1 100%!important;min-height:0!important;margin:0!important;overflow:hidden!important;}
.app:not(.dualPage) .contract .widgetbox > .tradingview-widget-container{position:absolute!important;inset:0!important;top:0!important;left:0!important;width:100%!important;height:100%!important;min-height:0!important;transform:none!important;display:block!important;overflow:hidden!important;}
.app:not(.dualPage) .contract .widgetbox .tradingview-widget-container__widget{width:100%!important;height:100%!important;}
.app:not(.dualPage) .contract .widgetbox iframe{display:block!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;}

function saoPauloDate(){var parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Sao_Paulo',year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date());var p={};parts.forEach(function(x){p[x.type]=+x.value});return p;}
function contractsFor(t){
 var now=saoPauloDate(),a=[];
 // Usar ano com quatro dígitos: BMFBOVESPA:BGIV2026, não BGIV26.
 // A rolagem por data é aproximada e conservadora, não substitui o calendário oficial da B3.
 for(var year=now.year;year<now.year+4&&a.length<t.count;year++){
  t.months.forEach(function(m){
   if(a.length>=t.count)return;
   var expiryYear=year, expiryMonth=m, expiryDay=29;
   if(t.id==='soja'){expiryMonth=m-1;expiryDay=28;if(expiryMonth===0){expiryMonth=12;expiryYear--}}
   else if(t.id==='milho')expiryDay=14;
   else if(t.id==='cafe')expiryDay=17;
   if(expiryYear<now.year || expiryYear===now.year && (expiryMonth<now.month || expiryMonth===now.month&&expiryDay<now.day))return;
   var code=t.prefix+LETTERS[m]+year;
   a.push({code:code,month:MONTHS[m-1]+'/'+year,sym:'BMFBOVESPA:'+code});
  });
 }
 return a;
}
